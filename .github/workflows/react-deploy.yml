name: CodeBuild Fleet Docker Issue Reproduction

on:
  push:
    branches: [ development ]
  workflow_dispatch:

jobs:
  container-test-job:
    runs-on: 
    - codebuild-test-fleet-${{ github.run_id }}-${{ github.run_attempt }}
    - image:custom
    - fleet:test-reproduction-fleet
    container:
      image: node:18-alpine  # Public image instead of private artifactory
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Test Docker availability
        run: |
          echo "Testing Docker access from container job..."
          docker --version || echo "Docker CLI not found"
          docker version --format '{{.Server.APIVersion}}' || echo "Cannot connect to Docker daemon"
          
      - name: Try Docker commands
        run: |
          echo "Attempting basic Docker operations..."
          docker ps || echo "Docker ps failed"
          docker images || echo "Docker images failed"
